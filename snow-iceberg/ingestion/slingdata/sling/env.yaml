# Reference only -- connections are set via env vars in docker-compose.yaml
# because sling's ${VAR} resolution doesn't work with /bin/sh entrypoint.
#
# To use this file directly with sling CLI (outside Docker):
#   cp env.yaml ~/.sling/env.yaml
#   export AWS_ACCESS_KEY_ID=...
#   export AWS_SECRET_ACCESS_KEY=...
#   export AWS_REGION=...
#   export S3_BUCKET_NAME=...

connections:
  POSTGRES_SOURCE:
    type: postgres
    host: localhost
    port: 5432
    user: sling
    password: sling
    database: slingdb
    schema: public

  ICEBERG_TARGET:
    type: iceberg
    catalog_type: glue
    glue_warehouse: s3://${S3_BUCKET_NAME}
    glue_region: ${AWS_REGION}
    s3_access_key_id: ${AWS_ACCESS_KEY_ID}
    s3_secret_access_key: ${AWS_SECRET_ACCESS_KEY}
    s3_region: ${AWS_REGION}

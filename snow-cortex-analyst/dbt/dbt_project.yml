name: 'snow_cortex_analyst'
version: '1.0.0'

config-version: 2

profile: 'snow_cortex_analyst'

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  env_code: "{{ env_var('ENV_CODE', 'dev') | trim | lower }}"
  project_code: "{{ env_var('PROJECT_CODE', 'entechlog') | trim | lower }}"
  dw_db: "{{ env_var('ENV_CODE', 'dev') | trim | upper }}_{{ env_var('PROJECT_CODE', 'entechlog') | trim | upper }}_DW_DB"

  # -------------------------------------------------------------------------
  # Cortex Analyst Agent configuration
  # -------------------------------------------------------------------------
  agent_warehouse_default: "{{ env_var('ENV_CODE', 'dev') | trim | upper }}_{{ env_var('PROJECT_CODE', 'entechlog') | trim | upper }}_CORTEX_WH_XS"

  cortex_agents:
    - name: "{{ env_var('ENV_CODE', 'dev') | lower }}_sales_agent"
      display_name: "Sales Agent ({{ env_var('ENV_CODE', 'dev') | upper }})"
      database: "{{ env_var('ENV_CODE', 'dev') | trim | upper }}_{{ env_var('PROJECT_CODE', 'entechlog') | trim | upper }}_DW_DB"
      schema: semantic
      semantic_views:
        - order_stats_1d
        - customer_stats_1d
      instructions: sales_agent
      description: "Sales analytics agent with order and customer insights"
      grant_to_roles:
        - "{{ env_var('PROJECT_CODE', 'entechlog') | trim | upper }}_CORTEX_USER_ROLE"
      enabled: true
      timeout_seconds: 60
      token_limit: 16000
      query_timeout_seconds: 60

seeds:
  snow_cortex_analyst:
    +database: "{{ env_var('ENV_CODE', 'dev') | trim | upper }}_{{ env_var('PROJECT_CODE', 'entechlog') | trim | upper }}_RAW_DB"
    +schema: seed
    +quote_columns: false

models:
  snow_cortex_analyst:
    obt:
      +materialized: view
      +schema: obt
    semantic:
      +materialized: semantic_view
      +schema: semantic
      +tags: ['semantic']
    +tags: ['cortex-analyst']

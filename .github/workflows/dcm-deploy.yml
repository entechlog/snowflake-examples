# =============================================================================
# CI/CD: DCM Plan & Deploy (snow CLI + key-pair auth)
#
# PRs touching snow-infra/dcm/:  plan only
# Push to develop:               plan + deploy to DEV
# Push to main:                  plan + deploy to STG, then PRD (PRD gated)
# workflow_dispatch:             manual plan or deploy to any env
#
# Uses our own composite actions (snow-cli-plan-deploy + ensure-team-dcm-project)
# instead of Snowflake-Labs/snowflake_dcm_projects/actions/dcm-{plan,deploy}
# because:
#   - Those actions are OIDC-only and would need a Snowflake WORKLOAD_IDENTITY
#     security integration; this demo uses key-pair auth which is simpler
#   - Those actions read manifest.account_identifier via yq, which doesn't
#     interpolate our `{{ env.SNOWFLAKE_ACCOUNT }}` template. snow CLI does.
#
# Manifest target fields use `{{ env.SNOWFLAKE_ACCOUNT }}` and
# `{{ env.SNOWFLAKE_ROLE }}` interpolation, so the env vars set here drive the
# manifest's account_identifier and project_owner at runtime. Local dev sets
# the same env vars in the shell before running snow CLI.
#
# Macros live in snow-infra/dcm/shared/macros/ and are synced into each
# project's sources/macros/ by scripts/sync_macros.sh. CI runs the sync
# before every plan/deploy as a safety net so a stale copy never ships.
#
# ADO Migration Notes:
#   - Replace `uses: ./.github/actions/snow-cli-plan-deploy` with `script:`
#     blocks installing snow CLI + invoking `snow dcm plan/deploy`
#   - Replace `secrets.*` with ADO variable groups or key-vault references
#   - Manual PRD approval: configure an "Environment" approval check in
#     ADO Pipelines -> Environments
# =============================================================================

name: DCM Plan & Deploy

on:
  pull_request:
    paths:
      - 'snow-infra/dcm/**'
  push:
    branches:
      - develop
      - main
    paths:
      - 'snow-infra/dcm/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'DCM target'
        required: true
        default: 'DCM_SALES_DEV'
        type: choice
        options:
          - DCM_SALES_DEV
          - DCM_SALES_STG
          - DCM_SALES_PRD
      action:
        description: 'plan | deploy (deploy lets you test any env from a feature branch)'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - deploy

permissions:
  contents: read
  pull-requests: write

env:
  TEAM_PROJECT_PATH: snow-infra/dcm/teams/sales/dcm
  TEAM_NAME:         SALES
  TEAM_WAREHOUSE:    SVC_SALES_DCM_WH_XS
  TEAM_ROLE:         SVC_SALES_DCM_ROLE

jobs:
  # ---------------------------------------------------------------------------
  # Plan: runs on every PR + before every deploy
  # ---------------------------------------------------------------------------
  plan:
    name: Plan
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'snowflake-stg' || 'snowflake-dev' }}

    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || (github.ref_name == 'main' && 'DCM_SALES_STG' || 'DCM_SALES_DEV') }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Sync canonical macros into project
        shell: bash
        run: bash snow-infra/dcm/scripts/sync_macros.sh

      - name: DCM plan
        uses: ./.github/actions/snow-cli-plan-deploy
        with:
          action:                plan
          target:                ${{ env.TARGET }}
          project_path:          ${{ env.TEAM_PROJECT_PATH }}
          snowflake_account:     ${{ secrets.SNOWFLAKE_ACCOUNT }}
          snowflake_user:        ${{ secrets.SNOWFLAKE_USER }}
          snowflake_role:        ${{ env.TEAM_ROLE }}
          snowflake_warehouse:   ${{ env.TEAM_WAREHOUSE }}
          snowflake_private_key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

  # ---------------------------------------------------------------------------
  # Deploy DEV: push to develop
  # ---------------------------------------------------------------------------
  deploy-dev:
    name: Deploy to DEV
    needs: plan
    if: github.event_name == 'push' && github.ref_name == 'develop'
    runs-on: ubuntu-latest
    environment: snowflake-dev

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Sync canonical macros into project
        shell: bash
        run: bash snow-infra/dcm/scripts/sync_macros.sh

      - name: Ensure team DCM PROJECT exists (idempotent)
        uses: ./.github/actions/ensure-team-dcm-project
        with:
          env_code:               DEV
          team:                   ${{ env.TEAM_NAME }}
          snowflake_account:      ${{ secrets.SNOWFLAKE_ACCOUNT }}
          snowflake_user:         ${{ secrets.SNOWFLAKE_USER }}
          snowflake_role:         ${{ env.TEAM_ROLE }}
          snowflake_private_key:  ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: DCM deploy (DEV)
        uses: ./.github/actions/snow-cli-plan-deploy
        with:
          action:                deploy
          target:                DCM_SALES_DEV
          alias:                 ci-deploy-${{ github.sha }}
          project_path:          ${{ env.TEAM_PROJECT_PATH }}
          snowflake_account:     ${{ secrets.SNOWFLAKE_ACCOUNT }}
          snowflake_user:        ${{ secrets.SNOWFLAKE_USER }}
          snowflake_role:        ${{ env.TEAM_ROLE }}
          snowflake_warehouse:   ${{ env.TEAM_WAREHOUSE }}
          snowflake_private_key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

  # ---------------------------------------------------------------------------
  # Deploy STG then PRD: push to main (PRD gated by GitHub environment)
  # ---------------------------------------------------------------------------
  deploy-stg:
    name: Deploy to STG
    needs: plan
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: snowflake-stg

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Sync canonical macros into project
        shell: bash
        run: bash snow-infra/dcm/scripts/sync_macros.sh

      - name: Ensure team DCM PROJECT exists (idempotent)
        uses: ./.github/actions/ensure-team-dcm-project
        with:
          env_code:               STG
          team:                   ${{ env.TEAM_NAME }}
          snowflake_account:      ${{ secrets.SNOWFLAKE_ACCOUNT }}
          snowflake_user:         ${{ secrets.SNOWFLAKE_USER }}
          snowflake_role:         ${{ env.TEAM_ROLE }}
          snowflake_private_key:  ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: DCM deploy (STG)
        uses: ./.github/actions/snow-cli-plan-deploy
        with:
          action:                deploy
          target:                DCM_SALES_STG
          alias:                 ci-deploy-${{ github.sha }}
          project_path:          ${{ env.TEAM_PROJECT_PATH }}
          snowflake_account:     ${{ secrets.SNOWFLAKE_ACCOUNT }}
          snowflake_user:        ${{ secrets.SNOWFLAKE_USER }}
          snowflake_role:        ${{ env.TEAM_ROLE }}
          snowflake_warehouse:   ${{ env.TEAM_WAREHOUSE }}
          snowflake_private_key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

  deploy-prd:
    name: Deploy to PRD
    needs: deploy-stg
    runs-on: ubuntu-latest
    environment: snowflake-prd       # manual approval gate configured in GitHub UI

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Sync canonical macros into project
        shell: bash
        run: bash snow-infra/dcm/scripts/sync_macros.sh

      - name: DCM plan (PRD pre-flight)
        uses: ./.github/actions/snow-cli-plan-deploy
        with:
          action:                plan
          target:                DCM_SALES_PRD
          project_path:          ${{ env.TEAM_PROJECT_PATH }}
          snowflake_account:     ${{ secrets.SNOWFLAKE_ACCOUNT }}
          snowflake_user:        ${{ secrets.SNOWFLAKE_USER }}
          snowflake_role:        ${{ env.TEAM_ROLE }}
          snowflake_warehouse:   ${{ env.TEAM_WAREHOUSE }}
          snowflake_private_key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Ensure team DCM PROJECT exists (idempotent)
        uses: ./.github/actions/ensure-team-dcm-project
        with:
          env_code:               PRD
          team:                   ${{ env.TEAM_NAME }}
          snowflake_account:      ${{ secrets.SNOWFLAKE_ACCOUNT }}
          snowflake_user:         ${{ secrets.SNOWFLAKE_USER }}
          snowflake_role:         ${{ env.TEAM_ROLE }}
          snowflake_private_key:  ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: DCM deploy (PRD)
        uses: ./.github/actions/snow-cli-plan-deploy
        with:
          action:                deploy
          target:                DCM_SALES_PRD
          alias:                 ci-deploy-${{ github.sha }}
          project_path:          ${{ env.TEAM_PROJECT_PATH }}
          snowflake_account:     ${{ secrets.SNOWFLAKE_ACCOUNT }}
          snowflake_user:        ${{ secrets.SNOWFLAKE_USER }}
          snowflake_role:        ${{ env.TEAM_ROLE }}
          snowflake_warehouse:   ${{ env.TEAM_WAREHOUSE }}
          snowflake_private_key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

  # ---------------------------------------------------------------------------
  # Manual deploy (workflow_dispatch from any branch — for feature-branch testing)
  # ---------------------------------------------------------------------------
  manual-deploy:
    name: Manual deploy (${{ inputs.target }})
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'deploy'
    runs-on: ubuntu-latest
    environment: >-
      ${{
        contains(inputs.target, 'PRD') && 'snowflake-prd'
        || contains(inputs.target, 'STG') && 'snowflake-stg'
        || 'snowflake-dev'
      }}

    env:
      ENV_CODE: >-
        ${{
          contains(inputs.target, 'PRD') && 'PRD'
          || contains(inputs.target, 'STG') && 'STG'
          || 'DEV'
        }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Sync canonical macros into project
        shell: bash
        run: bash snow-infra/dcm/scripts/sync_macros.sh

      - name: Ensure team DCM PROJECT exists (idempotent)
        uses: ./.github/actions/ensure-team-dcm-project
        with:
          env_code:               ${{ env.ENV_CODE }}
          team:                   ${{ env.TEAM_NAME }}
          snowflake_account:      ${{ secrets.SNOWFLAKE_ACCOUNT }}
          snowflake_user:         ${{ secrets.SNOWFLAKE_USER }}
          snowflake_role:         ${{ env.TEAM_ROLE }}
          snowflake_private_key:  ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: DCM deploy
        uses: ./.github/actions/snow-cli-plan-deploy
        with:
          action:                deploy
          target:                ${{ inputs.target }}
          alias:                 manual-${{ github.sha }}
          project_path:          ${{ env.TEAM_PROJECT_PATH }}
          snowflake_account:     ${{ secrets.SNOWFLAKE_ACCOUNT }}
          snowflake_user:        ${{ secrets.SNOWFLAKE_USER }}
          snowflake_role:        ${{ env.TEAM_ROLE }}
          snowflake_warehouse:   ${{ env.TEAM_WAREHOUSE }}
          snowflake_private_key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

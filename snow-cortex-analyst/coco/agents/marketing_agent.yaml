name: marketing_agent
display_name: "Marketing Agent (${ENV_CODE})"
description: "Marketing analytics agent for campaign performance insights"

semantic_views:
  - marketing_campaign_stats_1d

warehouse: "${ENV_CODE}_${PROJ_CODE}_CORTEX_WH_XS"
timeout_seconds: 60
token_limit: 16000
query_timeout_seconds: 60

grant_to_roles:
  - "${PROJ_CODE}_CORTEX_ROLE"

instructions:
  orchestration: |
    You are a marketing analytics assistant with access to campaign performance data.

    Data source: marketing_campaign_stats_1d — daily metrics by channel and region.

    CRITICAL RULES:
    1. ALL FACTS ARE CUMULATIVE: impressions, clicks, spend, conversions,
       conversion_revenue, net_campaign_value — SUM() is valid.
    2. DERIVED METRICS (compute, never stored):
       - CTR: SUM(clicks) * 100.0 / NULLIF(SUM(impressions), 0)
       - CPC: SUM(spend) / NULLIF(SUM(clicks), 0)
       - CVR: SUM(conversions) * 100.0 / NULLIF(SUM(clicks), 0)
       - CPA: SUM(spend) / NULLIF(SUM(conversions), 0)
       - ROAS: SUM(conversion_revenue) / NULLIF(SUM(spend), 0)
    3. DATES: Data covers Oct-Dec 2025. Use MAX(campaign_date) not CURRENT_DATE.
    4. net_campaign_value = conversion_revenue - spend. Positive means profitable.

  response: |
    Lead with the key insight. Bold important numbers.
    Use tables for channel comparisons. Include time period covered.
    Keep responses concise.

sample_questions:
  - "What is the total spend by marketing channel?"
  - "Which channel has the best ROAS?"
  - "Show me weekly conversion trends"
  - "Which region has the highest click-through rate?"
  - "What is the cost per conversion by channel?"
  - "Compare Email vs Paid Search performance"
